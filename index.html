<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my advance css</title>
  </head>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "DM Mono", monospace;
    }

    .container {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      height: 250px;
      width: 500px;
      border: 2px solid rgb(127, 96, 96);
      background: rgb(22, 47, 22);
      gap: 10px;
      align-items: center;
      justify-content: space-evenly;
      align-content: center;
      padding: 10px;
      margin: 10px;
    }

    .box {
      min-width: 80px;
      background: lightgray;
      height: 40px;
      text-align: center;
      line-height: 40px;
      color: rgb(138, 126, 111);
    }

    .box1 {
      background: lightblue;
    }
    .box2 {
      background: lightgreen;
      /* align-self: center; override */
    }
    .box3 {
      background: lightpink;
      /* align-self: self-start; override */
    }
    .box4 {
      background: lightseagreen;
      /* align-self: center; */
    }

    .diffbox1 {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: lightgray;
      height: 40px;
      text-align: center;
      align-content: center;
      border-radius: 8px;
    }

    .diffbox2 {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      border-radius: 8px;
      background: lightskyblue;
      text-align: center;
      align-content: center;
      height: 40px;
    }

    .diffbox3 {
      position: absolute;
      left: 10px;
      border-radius: 8px;
      background: lightskyblue;
      text-align: center;
      align-content: center;
      width: 40px;
      top: 60px;
      bottom: 60px;
    }

    .diffbox4 {
      position: absolute;
      background: lightgray;
      top: 60px;
      bottom: 60px;
      right: 10px;
      border-radius: 8px;
      width: 40px;
      align-content: center;
      text-align: center;
    }
  </style>
  <body>
    <h3>Trainin align-items / content / self / absolute</h3>
    <div class="container">
      <div class="box box1">BOX 1</div>
      <div class="box box2">BOX 2</div>
      <div class="box box3">BOX 3</div>
      <div class="box box4">BOX 4</div>

      <div class="diffbox1">DIFF BOX 1</div>
      <div class="diffbox2">DIFF BOX 2</div>
      <div class="diffbox3">DIFF BOX 3</div>
      <div class="diffbox4">DIFF BOX 4</div>
    </div>
  </body>
</html>
